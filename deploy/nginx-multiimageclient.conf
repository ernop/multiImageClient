# MultiImageClient shared-site nginx layer.
#
# Design (defense in depth, outermost first):
#   1. DEFAULT-DENY VHOSTS: any request that doesn't carry the exact expected
#      Host header — every IP scanner, every bot spraying hostnames — gets
#      connection-closed (444) without a byte of response. The site is
#      unguessable by IP.
#   2. SECRET PATH: the app lives under a long random path segment, not /.
#      Everything else on the real hostname 404s. Even someone who learns the
#      hostname (e.g. from certificate-transparency logs, which publish every
#      Let's Encrypt certificate) still needs the path.
#      >>> Replace REPLACE-WITH-LONG-RANDOM-SEGMENT below (e.g. output of
#      `openssl rand -hex 16`) and keep it out of chat logs/screenshots. <<<
#   3. APP LOGIN: behind both, the app's own username/password gate
#      (ui-auth.json) — the layer that actually authenticates people.
#
# The app binds 127.0.0.1 only; nginx is the sole public listener.
#
# Install:
#   sudo cp nginx-multiimageclient.conf /etc/nginx/sites-available/multiimageclient
#   sudo ln -s /etc/nginx/sites-available/multiimageclient /etc/nginx/sites-enabled/
#   (edit: hostname, secret path, cert paths)   sudo nginx -t && sudo systemctl reload nginx

# Never advertise the nginx version.
# (Put "server_tokens off;" in the http{} block of nginx.conf if not already.)

# Failed-login rate limit zone (the app also throttles per-IP internally).
limit_req_zone $binary_remote_addr zone=mic_login:1m rate=6r/m;
# General request ceiling: generous for the polling UI, hostile to floods.
limit_req_zone $binary_remote_addr zone=mic_general:10m rate=30r/s;

# 1. Catch-alls: wrong/missing Host on either port -> close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Any cert works here; scanners only see a handshake then a closed socket.
    # A self-signed throwaway avoids exposing the real hostname via SNI-less probes:
    #   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=invalid" \
    #     -keyout /etc/nginx/snakeoil.key -out /etc/nginx/snakeoil.crt
    ssl_certificate     /etc/nginx/snakeoil.crt;
    ssl_certificate_key /etc/nginx/snakeoil.key;
    return 444;
}

# 2. The real site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-host.example.com;          # <-- your real hostname

    ssl_certificate     /etc/letsencrypt/live/your-host.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-host.example.com/privkey.pem;

    # Image uploads: the UI accepts up to 4 input images per job.
    client_max_body_size 64m;

    # No hints for probes: the bare hostname and any unknown path 404 with an
    # empty body. (404, not 444, so the hostname behaves like a parked host.)
    location / {
        return 404;
    }

    # Redirect the bare secret segment to its canonical trailing-slash form so
    # the app's relative URLs (api/..., app.js) resolve correctly.
    location = /REPLACE-WITH-LONG-RANDOM-SEGMENT {
        return 301 /REPLACE-WITH-LONG-RANDOM-SEGMENT/;
    }

    # Tighter limit on the login endpoint (brute-force damping; the app also
    # locks an IP out after 10 failures in 5 minutes).
    location = /REPLACE-WITH-LONG-RANDOM-SEGMENT/api/auth/login {
        limit_req zone=mic_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5960/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. The app, with the secret prefix stripped (trailing slash on
    # proxy_pass). The frontend uses page-relative URLs, so it needs no
    # path-base configuration.
    location /REPLACE-WITH-LONG-RANDOM-SEGMENT/ {
        limit_req zone=mic_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:5960/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;      # long generations; the UI polls, but keep slack
        proxy_request_buffering off;  # stream uploads through
    }
}

# Optional: port 80 for the real hostname just redirects to https.
server {
    listen 80;
    listen [::]:80;
    server_name your-host.example.com;
    return 301 https://$host$request_uri;
}
