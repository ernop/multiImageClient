# MultiImageClient shared-site nginx vhost.
#
# This file deliberately DOES NOT define or replace a default_server. It is
# safe to add beside existing sites: only the exact REPLACE_HOSTNAME Host/SNI
# reaches it. Existing Terrain/Fuseki/tpDiscord/default routes retain control
# of every other hostname and direct-IP request.
#
# Replace:
#   REPLACE_HOSTNAME                 dedicated DNS name for this service
#   REPLACE-WITH-LONG-RANDOM-SEGMENT random path (openssl rand -hex 16)
#
# Obtain the certificate before enabling the TLS block, or use the two-phase
# procedure in deploy/README.md.

limit_req_zone $binary_remote_addr zone=multiimage_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=multiimage_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_HOSTNAME;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name REPLACE_HOSTNAME;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/REPLACE_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_HOSTNAME/privkey.pem;

    client_max_body_size 64m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Learning the hostname is insufficient; the unlisted random path is also
    # required. Unknown paths reveal no application details.
    location / {
        return 404;
    }

    location = /REPLACE-WITH-LONG-RANDOM-SEGMENT {
        return 301 /REPLACE-WITH-LONG-RANDOM-SEGMENT/;
    }

    location = /REPLACE-WITH-LONG-RANDOM-SEGMENT/api/auth/login {
        limit_req zone=multiimage_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5960/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # The trailing slash strips the secret prefix. Frontend API and media URLs
    # are page-relative, so copy/set-active/archive/viewer all remain inside it.
    location /REPLACE-WITH-LONG-RANDOM-SEGMENT/ {
        limit_req zone=multiimage_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:5960/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
